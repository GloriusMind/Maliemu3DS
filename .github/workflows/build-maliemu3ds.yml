name: Build Maliemu3DS (Android APK)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-maliemu3ds:
    name: Build Maliemu3DS APK (ARM Mali Turbo & FrameGen)
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: arm64-v8a

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache apksigner ninja-build
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.25.1" "ndk;26.1.10909125" "platforms;android-35" "build-tools;35.0.0"

      - name: Fetch and Populate All Submodules and Externals
        run: |
          python3 -c '
          import configparser, subprocess, os
          config = configparser.ConfigParser()
          config.read(".gitmodules")
          for sec in config.sections():
              path = config[sec].get("path")
              url = config[sec].get("url")
              if path and url and not os.path.exists(os.path.join(path, "CMakeLists.txt")):
                  print(f"Ensuring external: {path} from {url}")
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  subprocess.run(["git", "clone", "--depth", "1", "--recursive", url, path], check=False)
          '

      - name: Cache Gradle Packages & ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-maliemu3ds-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-maliemu3ds-

      - name: Grant Gradle Permissions
        run: chmod +x src/android/gradlew

      - name: Build Maliemu3DS APK (assembleRelease)
        run: |
          cd src/android
          export NDK_CCACHE=$(which ccache)
          ./gradlew assembleRelease --stacktrace

      - name: Prepare Maliemu3DS Release Artifacts
        if: always()
        run: |
          mkdir -p build_output/
          find src/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/ \; || true
          echo "Artifacts list:"
          ls -la build_output/ || true

      - name: Upload Maliemu3DS APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Maliemu3DS-Android-Release
          path: build_output/
          retention-days: 30
