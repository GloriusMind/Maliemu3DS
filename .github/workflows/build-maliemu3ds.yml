name: Build Maliemu3DS (Android APK)

# Compilação automática desativada a pedido do usuário
# Para compilar, acesse a aba 'Actions' no GitHub e clique em 'Run workflow'
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-maliemu3ds:
    name: Build Maliemu3DS APK (ARM Mali Turbo & FrameGen)
    runs-on: ubuntu-latest

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: arm64-v8a

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with: 
          packages: platform-tools platforms;android-32 build-tools;32.0.2

      - name: Cache Gradle Packages & ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-maliemu3ds-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-maliemu3ds-

      - name: Install Android NDK and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache apksigner ninja-build
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3" "ndk;26.1.10909125"

      - name: Grant Gradle Permissions
        run: chmod +x src/android/gradlew

      - name: Build Maliemu3DS APK (assembleRelease)
        run: |
          cd src/android
          export NDK_CCACHE=$(which ccache)
          ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Prepare Maliemu3DS Release Artifacts
        run: |
          mkdir -p build_output/
          find src/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/ \;
          echo "Artifacts list:"
          ls -la build_output/

      - name: Upload Maliemu3DS APK
        uses: actions/upload-artifact@v4
        with:
          name: Maliemu3DS-Android-Universal
          path: build_output/
          retention-days: 30
